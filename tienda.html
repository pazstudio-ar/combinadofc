<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda — Combinado FC</title>
  <meta name="description" content="Tienda oficial de Combinado FC: camisetas, buzos, camperas y accesorios. Pedí por WhatsApp.">
  <meta name="theme-color" content="#0a0d0b">
  <link rel="canonical" href="https://alanpaz24.github.io/combinado/NOMBRE-DE-LA-PAGINA.html">
  <meta property="og:title" content="Título de la página — Combinado FC">
  <meta property="og:description" content="Descripción corta de la página.">
  <meta property="og:image" content="https://alanpaz24.github.io/combinado/img/logo/compartir.jpg">
  <meta property="og:url" content="https://alanpaz24.github.io/combinado/NOMBRE-DE-LA-PAGINA.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <link rel="icon" href="img/logo/escudo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body data-pagina="tienda">

  <header class="cabecera" id="cabecera"></header>

  <main>
    <section class="ml-tienda">
      <div class="contenedor">
        <div class="ml-barra">
          <div class="ml-titulo"><img src="img/logo/escudo.png" alt=""><div><h1>Tienda oficial</h1><small>Combinado FC · pedidos por WhatsApp</small></div></div>
          <input type="search" id="buscar" class="ml-buscar" placeholder="Buscar camisetas, buzos, camperas…" aria-label="Buscar productos">
        </div>
        <div class="ml-layout">
          <aside class="ml-lateral">
            <h2>Categorías</h2>
            <div class="filtros" id="filtros"></div>
          </aside>
          <div class="ml-resultados">
            <div class="ml-cab">
              <span id="ml-cant"></span>
              <label>Ordenar por
                <select id="orden">
                  <option value="relevantes">Más relevantes</option>
                  <option value="menor">Menor precio</option>
                  <option value="mayor">Mayor precio</option>
                </select>
              </label>
            </div>
            <div class="grid-productos" id="grid-productos"></div>
            <p class="nota-tienda">Los precios y la disponibilidad se confirman por WhatsApp. El pago y la entrega se coordinan con el club.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Detalle de producto -->
  <div class="pd-fondo" id="pd" hidden>
    <div class="pd-caja" role="dialog" aria-modal="true" aria-labelledby="pd-titulo">
      <button class="pd-cerrar" id="pd-cerrar" aria-label="Cerrar">✕</button>
      <div class="pd-contenido" id="pd-contenido"></div>
    </div>
  </div>

  <!-- Carrito -->
  <button class="carrito-flotante" id="abrir-carrito" aria-label="Ver mi pedido" title="Mi pedido">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
    <span class="cant" id="carrito-cant">0</span>
  </button>
  <div class="carrito-fondo" id="carrito-fondo" hidden></div>
  <aside class="carrito" id="carrito" aria-label="Mi pedido" aria-hidden="true">
    <div class="carrito-cab">
      <h2>Mi pedido</h2>
      <button id="cerrar-carrito" aria-label="Cerrar">✕</button>
    </div>
    <div class="carrito-items" id="carrito-items"></div>
    <div class="carrito-pie" id="carrito-pie"></div>
  </aside>

  <footer class="pie" id="pie"></footer>

  <script src="js/comun.js" defer></script>
  <script src="js/tienda.js" defer></script>
</body>
</html>
